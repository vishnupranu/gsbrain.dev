version: "3.9"

# ==============================================================================
# GSBrain.dev — Coolify Production Deployment
# Target: coolify.guideitsol.in
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gsbrain-dev-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - APP_VERSION=${APP_VERSION:-0.1.0}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    labels:
      - "coolify.managed=true"
      - "coolify.name=gsbrain-dev"
    networks:
      - gsbrain-network

networks:
  gsbrain-network:
    driver: bridge
